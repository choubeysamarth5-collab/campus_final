<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusBot Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-theme="dark" class="admin-page">

  <!-- Admin Top Nav -->
  <nav class="admin-nav">
    <h1>⚙️ CampusBot Admin</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="index.html" class="btn-sm">← Back to Bot</a>
      <button class="theme-toggle" id="themeToggle"><span class="theme-icon">☀️</span></button>
    </div>
  </nav>

  <div class="admin-body">
    <!-- Sidebar Navigation -->
    <nav class="admin-sidebar">
      <button class="admin-nav-btn active" onclick="showSection('dashboard')">📊 Dashboard</button>
      <button class="admin-nav-btn" onclick="showSection('faqs')">📋 FAQs</button>
      <button class="admin-nav-btn" onclick="showSection('add-faq')">➕ Add FAQ</button>
      <button class="admin-nav-btn" onclick="showSection('logs')">📜 Chat Logs</button>
      <button class="admin-nav-btn" onclick="showSection('feedback')">⭐ Feedback</button>
    </nav>

    <!-- Content Area -->
    <div class="admin-content">

      <!-- DASHBOARD -->
      <div id="section-dashboard" class="admin-section active">
        <h2>Dashboard</h2>
        <div class="stat-grid" id="statGrid">
          <div class="stat-card">
            <span class="stat-num" id="statFaqs">—</span>
            <div class="stat-label">Total FAQs</div>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statConvos">—</span>
            <div class="stat-label">Conversations</div>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statFeedback">—</span>
            <div class="stat-label">Feedback Received</div>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statRating">—</span>
            <div class="stat-label">Avg Rating</div>
          </div>
        </div>
        <div class="card">
          <h3 style="font-family:var(--font-display);margin-bottom:12px;font-size:1rem">Recent Activity</h3>
          <div id="recentActivity">Loading…</div>
        </div>
      </div>

      <!-- FAQ LIST -->
      <div id="section-faqs" class="admin-section">
        <h2>Manage FAQs</h2>
        <div class="card">
          <table class="faq-table" id="faqTable">
            <thead>
              <tr>
                <th>Question</th>
                <th>Category</th>
                <th>Keywords</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="faqTableBody">
              <tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:24px">Loading FAQs…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ADD FAQ -->
      <div id="section-add-faq" class="admin-section">
        <h2>Add New FAQ</h2>
        <div class="card" style="max-width:600px">
          <div class="form-group">
            <label>Category</label>
            <select id="faqCategory" class="form-control">
              <option value="fees">Fees</option>
              <option value="admissions">Admissions</option>
              <option value="exams">Exams</option>
              <option value="hostel">Hostel</option>
              <option value="library">Library</option>
              <option value="placements">Placements</option>
              <option value="scholarships">Scholarships</option>
              <option value="timetable">Timetable</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Keywords (comma separated)</label>
            <input type="text" id="faqKeywords" class="form-control" placeholder="fee, payment, deadline, due date" />
          </div>
          <div class="form-group">
            <label>Answer (English)</label>
            <textarea id="faqAnswerEn" class="form-control" placeholder="Type the English answer here…"></textarea>
          </div>
          <div class="form-group">
            <label>Answer (Hindi – optional)</label>
            <textarea id="faqAnswerHi" class="form-control" placeholder="हिंदी उत्तर…"></textarea>
          </div>
          <div class="form-group">
            <label>Answer (Marathi – optional)</label>
            <textarea id="faqAnswerMr" class="form-control" placeholder="मराठी उत्तर…"></textarea>
          </div>
          <button class="btn-primary" style="width:100%;margin-top:8px" onclick="addFAQ()">
            ➕ Add FAQ
          </button>
          <p id="addFaqMsg" style="margin-top:10px;font-size:0.82rem;color:var(--accent)"></p>
        </div>
      </div>

      <!-- CHAT LOGS -->
      <div id="section-logs" class="admin-section">
        <h2>Chat Logs</h2>
        <div class="card">
          <div id="logsContainer">Loading logs…</div>
        </div>
      </div>

      <!-- FEEDBACK -->
      <div id="section-feedback" class="admin-section">
        <h2>User Feedback</h2>
        <div class="card">
          <div id="feedbackContainer">Loading feedback…</div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
