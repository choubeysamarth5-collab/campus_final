<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot – Your College Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div class="bot-avatar">
        <span class="bot-icon">🎓</span>
        <span class="status-dot"></span>
      </div>
      <div class="bot-info">
        <h1 class="bot-name">CampusBot</h1>
        <span class="bot-status">Online · Always here to help</span>
      </div>
    </div>
    <div class="header-right">
      <!-- Language Selector -->
      <div class="lang-picker">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">म</button>
        <button class="lang-btn" data-lang="ta">த</button>
        <button class="lang-btn" data-lang="te">తె</button>
      </div>
      <!-- Theme Toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="theme-icon">☀️</span>
      </button>
      <!-- Admin Link -->
      <a href="admin.html" class="admin-link" title="Admin Panel">⚙️</a>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-layout">

    <!-- SIDEBAR: Quick Topics -->
    <aside class="sidebar">
      <h3 class="sidebar-title">Quick Topics</h3>
      <div class="topic-list" id="topicList">
        <!-- Injected by JS -->
      </div>
      <div class="sidebar-footer">
        <p>Need human help?</p>
        <a href="mailto:helpdesk@college.edu" class="contact-link">📧 helpdesk@college.edu</a>
        <a href="tel:+911234567890" class="contact-link">📞 +91 12345 67890</a>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">

      <!-- Messages Container -->
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Suggestion Chips -->
      <div class="chips-row" id="chipsRow">
        <!-- Injected by JS -->
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <input
          type="text"
          id="userInput"
          class="chat-input"
          placeholder="Ask me anything about your college…"
          autocomplete="off"
        />
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

    </main>

  </div>

  <!-- ===== FEEDBACK MODAL ===== -->
  <div class="modal-overlay" id="feedbackModal" style="display:none">
    <div class="modal">
      <h3>Rate this answer</h3>
      <div class="stars" id="starRating">
        <span class="star" data-val="1">★</span>
        <span class="star" data-val="2">★</span>
        <span class="star" data-val="3">★</span>
        <span class="star" data-val="4">★</span>
        <span class="star" data-val="5">★</span>
      </div>
      <textarea id="feedbackText" placeholder="Any comments? (optional)"></textarea>
      <div class="modal-actions">
        <button class="btn-primary" id="submitFeedback">Submit</button>
        <button class="btn-ghost" id="closeFeedback">Skip</button>
      </div>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
